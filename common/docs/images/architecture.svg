<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Vision AI CBT 시스템 아키텍처</title><desc id="desc">Cloudflare Pages가 정적 파일을 제공하고 브라우저에서 두 공부방을 실행합니다. 빅데이터는 CDN에서 Pyodide와 패키지를 불러와 Python Worker에서 실행하고, SQL은 내장 MySQL 파서와 호환 계층 및 SQLite WASM을 Worker에서 실행합니다. 기록은 localStorage에 저장하고 JSON 파일로 옮깁니다.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#27303b"/></pattern><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#76a5ff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a4ce84"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bba0f3"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63d0cb"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#eab571"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa8ba"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#eef3fa"/></marker></defs><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif} .muted{fill:#9aa8ba} .title{fill:#eef3fa;font-size:23px;font-weight:700}.body{fill:#9aa8ba;font-size:18px}.small{fill:#9aa8ba;font-size:16px}.eyebrow{fo