<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc"><title id="title">Vision AI CBT 아키텍처</title><desc id="desc">GitHub 소스를 빌드해 Cloudflare Pages로 배포합니다. 브라우저의 빅데이터와 SQL 실행 및 로컬 기록을 표시하고, 별도로 실행하는 Workbench 학습 AI를 구분합니다.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#29313c"/></pattern><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#83cf7b"/></marker><marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ad91f0"/></marker><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.heading{font-size:26px;font-weight:700;fill:#edf3fc}.card{font-size:20px;font-weight:700}.body{font-size:16px;fill:#b8c5d9}.small{font-size:14px}.label{font-size:16px;fill:#94a8c4}.panel{font-size:20px;font-weight:700;fill:#75a1ff}</style></defs><rect width="1400" height="1160" rx="22" fill="#0e1117"/><rect x="24" y="24" width="1352" height="1112" rx="18" fill="url(#dots)" stroke="#29313c"/><text x="60" y="64" class="heading">Vision AI CBT · 시스템 아키텍처</text><text x="1340" y="63" text-anchor="end" class="label">현재 구현 기준 · 웹 CBT / 로컬 학습 AI</text><g><rect x="70" y="105" width="330" height="110" rx="16" fill="#171c24" stroke="#75a1ff" stroke-opacity=".7"/><rect x="88" y="123" width="5" height="25" rx="2" fill="#75a1ff"/><text x="108" y="143" class="card" fill="#75a1ff">GitHub · 소스와 검사</text><text x="92" y="173" class="body">bigdata/ · mysql/ · common/</text><text x="380" y="197" text-anchor="end" class="small" fill="#75a1ff">GitHub Actions</text></g><g><rect x="535" y="105" width="330" height="110" rx="16" fill="#171c24" stroke="#75a1ff" stroke-opacity=".7"/><rect x="553" y="123" width="5" height="25" rx="2" fill="#75a1ff"/><text x="573" y="143" class="card" fill="#75a1ff">빌드 · 기능 검사</text><text x="557" y="173" class="