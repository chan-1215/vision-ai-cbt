harray="10 8"/><text x="74" y="793" class="panel" style="fill:#ad91f0">Windows PC · Workbench 학습 AI</text><text x="1320" y="792" text-anchor="end" class="label">웹 CBT와 별도 실행 · 브라우저 AI 연결은 미구현</text><g><rect x="80" y="830" width="300" height="145" rx="16" fill="#171c24" stroke="#efb45e" stroke-opacity=".7"/><rect x="98" y="848" width="5" height="25" rx="2" fill="#efb45e"/><text x="118" y="868" class="card" fill="#efb45e">MySQL Workbench</text><text x="102" y="898" class="body">#한글 요청 → 플러그인</text><text x="102" y="920" class="body">DB 구조 · 요청 앞 SQL 전달</text><text x="102" y="942" class="body">생성 SQL을 편집기에 삽입</text></g><g><rect x="500" y="830" width="400" height="145" rx="16" fill="#171c24" stroke="#ad91f0" stroke-opacity=".7"/><rect x="518" y="848" width="5" height="25" rx="2" fill="#ad91f0"/><text x="538" y="868" class="card" fill="#ad91f0">Ollama · qwen2.5-coder:3b</text><text x="522" y="898" class="body">127.0.0.1:11435 · 로컬 모델 추론</text><text x="522" y="920" class="body">52개 참고 예제 + 제공된 DB 구조</text><text x="522" y="942" class="body">새 모델 훈련 / 미세 조정 없음</text></g><g><rect x="1020" y="830" width="280" height="145" rx="16" fill="#171c24" stroke="#52c9c3" stroke-opacity=".7"/><rect x="1038" y="848" width="5" height="25" rx="2" fill="#52c9c3"/><text x="1058" y="868" class="card" fill="#52c9c3">MySQL 서버</text><text x="1042" y="898" class="body">Workbench가 DB에 연결</text><text x="1042" y="920" class="body">구조 읽기: 메타데이터 조회</text><text x="1042" y="942" class="body">SQL 실행: 사용자가 직접</text></g><path d="M380 875H500" fill="none" stroke="#ad91f0" stroke-width="2"  marker-end="url(#ap)"/><path d="M500 945H380" fill="none" stroke="#ad91f0" stroke-width="2"  marker-end="url(#ap)"/><path d="M230 975V1025H1160V975" fill="none" stroke="#83cf7b" stroke-width="2"  marker-end="url(#ag)"/><text x="431" y="1015" class="label">사용자 검토 후 SQL 실행 · AI는 SQL을 자동 실행하지 않음</text><text x="74" y="1070" class="label">모델과 예제는 SQL 작성 보조용 · 웹 작업실의 175건 MySQL 비교 검사와 AI 검증은 별개</text></svg>