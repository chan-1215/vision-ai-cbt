<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">MySQL Workbench 학습 AI 아키텍처</title><desc id="desc">사용자가 Workbench에 한글 요청을 적으면 플러그인이 예제와 스키마를 참조해 로컬 Ollama 모델에 SQL 생성을 요청합니다. 조건에 맞는 정확한 예제 요청은 저장 답안을 반환합니다. 응답 큐와 편집 상태 재확인 후 SQL을 삽입하고, 학습자가 검토하여 직접 MySQL에서 실행합니다.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#27303b"/></pattern><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#76a5ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a4ce84"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bba0f3"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#63d0cb"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eab571"/></marker></defs><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif}.body{fill:#9aa8ba;font-size:19px}.small{fill:#9aa8ba;font-size:17px}</style><rect width="1600" height="1160" rx="24" fill="#101419"/><text x="40" y="52" fill="#eef3fa" font-size="30" font-weight="700">MySQL Workbench · 학습 AI</text><text x="40" y="85" class="body">한글 요청 → 참고 자료 구성 → SQL 생성 → 편집기 삽입 → 학습자 검토·실행</text><text x="1560" y="52" text-anchor="end" class="small">LOCAL AI ARCHITECTURE</text><rect x="40" y="145" width="1520" height="735" rx="22" fill="#141b24" stroke="#76a5ff" stroke-width="2" stroke-dasharray="10 9"/><rect x="41" y="146" width="1518" height="733" rx="22" fill="url(#dots)"/><rect x="70" y="130" width="440" height="32" rx="8" fill="#101419"/><text x="85" y="152" fill="#76a5ff" font-size="19" font-weight="700">사용자 PC · Workbench + 로컬 AI</text><path d="M240 320 V390" fill="none" stroke="#a4ce84" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#green)"/><rect x="189.5" y="345" width="101" height="29" rx="14" fill="#101419" stroke="#a4ce84" stroke-opacity=".45"/><text x="240" y="365" text-anchor="middle" fill="#a4ce84" font-size="16">한글 요청</text><path d="M400 467 H570" fill="none" stroke="#a4ce84" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M970 467 H1160" fill="none" stroke="#bba0f3" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#purple)"/><rect x="999.5" y="430" width="131" height="29" rx="14" fill="#101419" stroke="#bba0f3" stroke-opacity=".45"/><text x="1065" y="450" text-anchor="middle" fill="#bba0f3" font-size="16">로컬 HTTP</text><path d="M1320 545 V835 H240 V790" fill="none" stroke="#bba0f3" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#purple)"/><rect x="647" y="810" width="206" height="29" rx="14" fill="#101419" stroke="#bba0f3" stroke-opacity=".45"/><text x="750" y="830" text-anchor="middle" fill="#bba0f3" font-size="16">생성 결과 → 응답 큐</text><path d="M80 715 H60 V260 H80" fill="none" stroke="#a4ce84" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M850 640 V545" fill="none" stroke="#63d0cb" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#teal)"/><path d="M680 545 V590 H440 V710 H400" fill="none" stroke="#eab571" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#amber)"/><rect x="489.5" y="567" width="221" height="29" rx="14" fill="#101419" stroke="#eab571" stroke-opacity=".45"/><text x="600" y="587" text-anchor="middle" fill="#eab571" font-size="16">조건 충족 시 저장 답안</text><path d="M1520 260 H1540 V910 H1320 V940" fill="none" stroke="#a4ce84" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#green)"/><rect x="1194.5" y="887" width="251" height="29" rx="14" fill="#101419" stroke="#a4ce84" stroke-opacity=".45"/><text x="1320" y="907" text-anchor="middle" fill="#a4ce84" font-size="16">학습자가 검토 후 직접 실행</text><path d="M1160 1005 H1030 V715 H970" fill="none" stroke="#63d0cb" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/><rect x="912" y="850" width="236" height="29" rx="14" fill="#101419" stroke="#63d0cb" stroke-opacity=".45"/><text x="1030" y="870" text-anchor="middle" fill="#63d0cb" font-size="16">선택: 열 메타데이터 조회</text><rect x="80" y="200" width="1440" height="120" rx="16" fill="#19222d" stroke="#76a5ff" stroke-opacity=".6"/><rect x="100" y="220" width="5" height="28" rx="2" fill="#76a5ff"/><text x="120" y="242" fill="#eef3fa" font-size="24" font-weight="700">MySQL Workbench · SQL 편집기</text><text x="104" y="279" class="body">#한글 요청 입력 / SQL AI 메뉴·타이머로 요청 감지</text><text x="104" y="308" class="body">플러그인은 SQL을 편집기에 추가하며, 생성한 SQL을 자동으로 실행하지 않음</text><rect x="80" y="390" width="320" height="155" rx="16" fill="#19222d" stroke="#76a5ff" stroke-opacity=".6"/><rect x="100" y="410" width="5" height="28" rx="2" fill="#76a5ff"/><text x="120" y="432" fill="#eef3fa" font-size="24" font-weight="700">Workbench 플러그인</text><text x="104" y="469" class="body">요청 줄·커서·탭·DB 확인</text><text x="104" y="498" class="body">편집 상태 스냅샷 저장</text><text x="104" y="527" class="body">UI 스레드와 작업 스레드 분리</text><rect x="570" y="390" width="400" height="155" rx="16" fill="#19222d" stroke="#63d0cb" stroke-opacity=".6"/><rect x="590" y="410" width="5" height="28" rx="2" fill="#63d0cb"/><text x="610" y="432" fill="#eef3fa" font-size="24" font-weight="700">입력 구성 · 요청 분기</text><text x="594" y="469" class="body">정확한 예제 일치 조건 확인</text><text x="594" y="498" class="body">그 외: 예제·스키마·앞선 SQL 구성</text><text x="594" y="527" class="body">local_ai_core.py</text><rect x="1160" y="390" width="320" height="155" rx="16" fill="#19222d" stroke="#bba0f3" stroke-opacity=".6"/><rect x="1180" y="410" width="5" height="28" rx="2" fill="#bba0f3"/><text x="1200" y="432" fill="#eef3fa" font-size="24" font-weight="700">Ollama · 로컬 모델</text><text x="1184" y="469" class="body">127.0.0.1:11435 /api/chat</text><text x="1184" y="498" class="body">qwen2.5-coder:3b</text><text x="1184" y="527" class="body">사전 학습 모델로 SQL 생성</text><rect x="80" y="640" width="320" height="150" rx="16" fill="#19222d" stroke="#a4ce84" stroke-opacity=".6"/><rect x="100" y="660" width="5" height="28" rx="2" fill="#a4ce84"/><text x="120" y="682" fill="#eef3fa" font-size="24" font-weight="700">결과 적용 · 편집기 삽입</text><text x="104" y="719" class="body">응답 큐 → UI 타이머</text><text x="104" y="748" class="body">내용·커서·탭·DB 재확인</text><text x="104" y="777" class="body">편집 상태가 달라지면 삽입 취소</text><rect x="570" y="640" width="400" height="150" rx="16" fill="#19222d" stroke="#63d0cb" stroke-opacity=".6"/><rect x="590" y="660" width="5" height="28" rx="2" fill="#63d0cb"/><text x="610" y="682" fill="#eef3fa" font-size="24" font-weight="700">학습용 참고 자료</text><text x="594" y="719" class="body">course.json: 52개 문제·답안</text><text x="594" y="748" class="body">요청과 관련된 예제 최대 3개</text><text x="594" y="777" class="body">선택 DB 구조 · 앞선 SQL</text><rect x="1160" y="940" width="320" height="130" rx="16" fill="#19222d" stroke="#eab571" stroke-opacity=".6"/><rect x="1180" y="960" width="5" height="28" rx="2" fill="#eab571"/><text x="1200" y="982" fill="#eef3fa" font-size="24" font-weight="700">MySQL DB</text><text x="1184" y="1019" class="body">Workbench가 연결한 DB</text><text x="1184" y="1048" class="body">생성 SQL은 사용자가 직접 실행</text><text x="80" y="949" fill="#eef3fa" font-size="21" font-weight="700">웹 SQL 작업실과 별도의 실행 환경</text><text x="80" y="985" class="body">웹 작업실의 연습 예제를 참고하지만 브라우저 SQL 엔진을 사용하지 않습니다.</text><text x="80" y="1017" class="body">모델 준비 후 로컬 생성이 가능하며, 모델을 새로 훈련하거나 미세 조정하지 않습니다.</text><text x="80" y="1049" class="body">Workbench 연결 DB의 구조 읽기는 선택 기능입니다. 생성 SQL은 직접 검토해야 합니다.</text><text x="40" y="1125" class="small">실선: 요청·응답 흐름 / 청록색 점선: 선택적 메타데이터 조회 · 예제와 정확히 일치하면 조건에 따라 모델 호출 생략</text></svg>